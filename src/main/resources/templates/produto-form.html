<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Produto | DomusHub</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body class="dashboard-page"><div class="dashboard-shell"><aside th:replace="~{fragments :: sidebar('new-product')}"></aside><main class="dashboard-main"><header th:replace="~{fragments :: topbar('Cadastro de produto')}"></header><div class="dashboard-content content-narrow">
<div class="page-heading"><div><p class="eyebrow">CADASTRO</p><h1 th:text="${produto.id == null ? 'Novo produto' : 'Editar produto'}">Novo produto</h1></div></div>
<form th:action="@{/produtos/salvar}" th:object="${produto}" method="post" class="panel form-stack">
<input type="hidden" th:field="*{id}">
<label>Nome do produto<input th:field="*{nome}" required maxlength="100" placeholder="Ex.: Arroz"></label>
<label>Categoria<input th:field="*{categoria}" required placeholder="Ex.: Grãos"></label>
<label>Unidade<input th:field="*{unidade}" required placeholder="un, kg, L..."></label>
<label>Estoque mínimo<input type="number" th:field="*{estoqueMinimo}" min="0" step="0.01" required></label>
<p class="muted form-note">A quantidade inicial será zero. O estoque será atualizado automaticamente pelas entradas e saídas dos lotes.</p>
<div class="form-actions"><a class="btn secondary" th:href="@{/produtos}">Cancelar</a><button class="btn primary">Salvar produto</button></div>
</form></div></main></div></body></html>
